<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Laid out to fit Chrome's 600px popup height without scrolling. -->
  <header class="topbar">
    <h1>Resume Matcher</h1>
    <button id="open-log" class="link">View log</button>
  </header>

  <!-- Job details (prefilled from the page, editable) -->
  <section class="job">
    <div class="row">
      <input id="job-title" class="grow" type="text" placeholder="Job title" title="Job title">
      <input id="job-company" class="company" type="text" placeholder="Company" title="Company">
    </div>
    <div class="row source-row">
      <span id="source-info" class="muted grow"></span>
      <button id="use-selection" class="small">Use selection</button>
      <button id="use-page" class="small">Use whole page</button>
    </div>
    <div id="dup-warning" class="dup" hidden></div>
  </section>

  <p id="empty" class="empty">Highlight the job description on the page and reopen this popup, or click <b>Use whole page</b>.</p>

  <!-- Analysis results -->
  <section id="results" hidden>
    <div id="verdict" class="verdict">
      <div class="grow">
        <div id="verdict-label" class="verdict-label"></div>
        <div id="verdict-reason" class="verdict-reason"></div>
      </div>
      <button id="tailor" class="primary small" hidden>Copy prompt &amp; open Claude</button>
    </div>
    <div id="tailor-status" class="muted small-text" hidden></div>

    <ul id="scores" class="scores"></ul>

    <!-- Only real gaps get chips; matched keywords are a count (hover for the list). -->
    <div class="kw-row">
      <span class="kw-label bad" title="Tools/skills the posting asks for that you don't list. Red: required tool (counts toward skip). Amber: required but learnable. Grey: preferred or just mentioned.">Gaps</span>
      <div id="missing" class="chips"></div>
      <span id="matched-count" class="matched-count"></span>
    </div>

    <ul id="flags" class="flags"></ul>
    <div id="meta" class="meta"></div>

    <div class="row log-row">
      <select id="resume-used" class="grow" title="Resume used"></select>
      <button id="log-btn" class="primary">Log this application</button>
    </div>
    <div id="log-status" class="muted small-text"></div>
  </section>

  <!-- Raw text: lets you fix a bad capture or paste text when the page can't be read -->
  <details id="text-box">
    <summary>Job text (edit or paste, then Re-analyze)</summary>
    <textarea id="job-text" rows="6" placeholder="Paste the job description here"></textarea>
    <button id="reanalyze" class="small">Re-analyze</button>
  </details>

  <script src="../src/scoring.js"></script>
  <script src="../src/log-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
