<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Phone-width, single column, fits Chrome's 600px popup height without scrolling.
       Chrome popups don't reliably show title="" tooltips, so details expand on click. -->
  <header class="topbar">
    <h1>Resume Matcher</h1>
    <button id="open-log" class="link">View log</button>
  </header>

  <!-- Job details (prefilled from the page, editable) -->
  <section class="job">
    <div class="row">
      <input id="job-title" class="grow" type="text" placeholder="Job title" aria-label="Job title">
      <input id="job-company" class="company" type="text" placeholder="Company" aria-label="Company">
    </div>
    <div class="row source-row">
      <button id="use-selection" class="small">Use selection</button>
      <button id="use-page" class="small">Use whole page</button>
    </div>
    <div id="source-info" class="muted small-text"></div>
    <div id="dup-warning" class="dup" hidden></div>
  </section>

  <p id="empty" class="empty">Highlight the job description on the page and reopen this popup, or click <b>Use whole page</b>.</p>

  <!-- Analysis results -->
  <section id="results" hidden>
    <div id="verdict" class="verdict">
      <div id="verdict-label" class="verdict-label"></div>
      <div id="verdict-reason" class="verdict-reason"></div>
      <button id="tailor" class="primary" hidden>Copy prompt &amp; open Claude</button>
      <div id="tailor-status" class="small-text" hidden></div>
    </div>

    <ul id="scores" class="scores"></ul>

    <!-- Only real gaps get chips; matched keywords are a count that expands on click. -->
    <div class="kw-row">
      <button id="gaps-help" class="kw-label bad link" aria-expanded="false">Gaps ⓘ</button>
      <div id="missing" class="chips"></div>
    </div>
    <div id="gaps-legend" class="legend" hidden>
      <span class="chip core">required tool</span> counts toward skip
      <span class="chip soft">learnable</span> warning only
      <span class="chip mention">preferred</span> not required
    </div>
    <button id="matched-toggle" class="link matched-toggle" aria-expanded="false"></button>
    <div id="matched" class="chips matched-list" hidden></div>

    <ul id="flags" class="flags"></ul>
    <div id="meta" class="meta"></div>

    <div class="row log-row">
      <select id="resume-used" class="grow" aria-label="Resume used"></select>
      <button id="log-btn" class="primary">Log it</button>
    </div>
    <div id="log-status" class="muted small-text"></div>
  </section>

  <!-- Raw text: lets you fix a bad capture or paste text when the page can't be read -->
  <details id="text-box">
    <summary>Job text (edit or paste, then Re-analyze)</summary>
    <textarea id="job-text" rows="6" placeholder="Paste the job description here"></textarea>
    <button id="reanalyze" class="small">Re-analyze</button>
  </details>

  <script src="../src/scoring.js"></script>
  <script src="../src/log-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
