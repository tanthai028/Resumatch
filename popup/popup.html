<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Phone-width, single column, fits Chrome's 600px popup height without scrolling.
       Chrome popups don't reliably show title="" tooltips, so details expand on click. -->
  <header class="topbar">
    <h1>Resume Matcher</h1>
    <button id="open-log" class="link">View log</button>
  </header>

  <!-- Job details (prefilled from the page, editable). Shown once there is a result. -->
  <section id="job" hidden>
    <div class="row">
      <input id="job-title" class="grow" type="text" placeholder="Job title" aria-label="Job title">
      <input id="job-company" class="company" type="text" placeholder="Company" aria-label="Company">
    </div>
    <div class="segmented" role="group" aria-label="Text to analyze">
      <button id="use-selection" aria-pressed="false">Use selection</button>
      <button id="use-page" aria-pressed="false">Use whole page</button>
    </div>
  </section>
  <div id="source-info" class="muted small-text"></div>
  <div id="dup-warning" class="dup" hidden></div>

  <!-- Before any analysis: one instruction, one action. -->
  <div id="empty" class="empty">
    <p>Highlight the job description, then reopen this popup.</p>
    <button id="empty-page" class="primary">Analyze whole page</button>
  </div>

  <!-- Analysis results -->
  <section id="results" hidden>
    <div id="verdict" class="verdict">
      <div id="verdict-label" class="verdict-label"></div>
      <div id="verdict-reason" class="verdict-reason"></div>
      <button id="tailor" class="primary" hidden>Copy prompt &amp; open Claude</button>
      <div id="tailor-status" class="small-text" hidden></div>
    </div>

    <ul id="scores" class="scores"></ul>

    <!-- Only real gaps get chips; matched keywords are a count that expands on click. -->
    <div class="kw-row">
      <button id="gaps-help" class="kw-label link" aria-expanded="false" aria-controls="gaps-legend" aria-label="Gaps: show color key">Gaps<sup>?</sup></button>
      <div id="missing" class="chips"></div>
    </div>
    <div id="gaps-legend" class="legend" hidden>
      <span class="chip core">required tool</span><span>counts toward skip</span>
      <span class="chip soft">learnable</span><span>warning only</span>
      <span class="chip mention">preferred</span><span>not required</span>
    </div>
    <button id="matched-toggle" class="link matched-toggle" aria-expanded="false" aria-controls="matched"></button>
    <div id="matched" class="chips matched-list" hidden></div>

    <ul id="flags" class="flags"></ul>
    <div id="meta" class="meta"></div>

    <div class="row log-row">
      <label for="resume-used" class="log-label">Sent</label>
      <select id="resume-used" class="grow"></select>
      <button id="log-btn" class="primary">Log it</button>
    </div>
    <div id="log-status" class="muted small-text"></div>
  </section>

  <!-- Raw text: lets you fix a bad capture or paste text when the page can't be read -->
  <details id="text-box">
    <summary>Paste text</summary>
    <textarea id="job-text" rows="6" placeholder="Paste or edit the job description"></textarea>
    <button id="reanalyze" class="small">Re-analyze</button>
  </details>

  <script src="../src/scoring.js"></script>
  <script src="../src/log-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
