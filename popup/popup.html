<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Matcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Minimal by design: verdict, scores, gaps, dealbreakers, log. Phone-width,
       fits Chrome's 600px popup height. Chrome popups don't reliably show
       title="" tooltips, so explanations expand on click instead. -->
  <header class="topbar">
    <h1>Resume Matcher</h1>
    <span class="top-links">
      <button id="open-profile" class="link">Profile</button>
      <button id="open-log" class="link">View log</button>
    </span>
  </header>

  <div id="notice" class="notice" hidden></div>

  <!-- Workday application pages: fill the form from your profile. -->
  <div id="autofill" class="autofill" hidden>
    <p class="af-intro">Fills this page from your profile. Check it, then click Next yourself.</p>
    <div class="row">
      <label for="af-resume" class="log-label">Upload</label>
      <select id="af-resume" class="grow"></select>
      <button id="af-run" class="primary">Autofill</button>
    </div>
    <div id="af-note" class="log-note" hidden></div>
  </div>

  <!-- Before any analysis: one instruction, one action, paste as a fallback. -->
  <div id="empty" class="empty">
    <p>Highlight the job description, then reopen this popup.</p>
    <div class="row">
      <button id="empty-page" class="primary">Analyze whole page</button>
      <button id="show-paste" class="link">or paste text</button>
    </div>
  </div>

  <!-- Paste box: only shown on request or when the page can't be read. -->
  <div id="paste" class="paste" hidden>
    <textarea id="job-text" rows="6" placeholder="Paste the job description"></textarea>
    <button id="reanalyze" class="primary">Analyze</button>
  </div>

  <!-- Analysis results -->
  <section id="results" hidden>
    <!-- Title and company look like text but are editable (used for the log). -->
    <div class="job">
      <input id="job-title" class="inline title" type="text" placeholder="Add job title" aria-label="Job title">
      <div class="row">
        <input id="job-company" class="inline company grow" type="text" placeholder="Add company" aria-label="Company">
        <label for="job-id" class="id-label">ID</label>
        <input id="job-id" class="inline job-id" type="text" placeholder="none found" aria-label="Job ID or requisition number">
      </div>
    </div>

    <div id="verdict" class="verdict">
      <div id="verdict-label" class="verdict-label"></div>
      <div id="verdict-reason" class="verdict-reason"></div>
      <button id="tailor" class="primary" hidden>Copy prompt and open Claude</button>
    </div>

    <ul id="scores" class="scores" aria-label="Fit score per resume, out of 100"></ul>

    <div id="gaps-row" class="kw-row">
      <button id="gaps-help" class="kw-label link" aria-expanded="false" aria-controls="gaps-legend">Gaps <span class="q" aria-hidden="true">?</span></button>
      <div id="missing" class="chips"></div>
    </div>
    <div id="gaps-legend" class="legend" hidden>
      <span class="chip core">tool</span><span>required, counts toward skip</span>
      <span class="chip soft">skill</span><span>required, but learnable</span>
      <span class="chip mention">extra</span><span>preferred, not required</span>
    </div>

    <ul id="flags" class="flags"></ul>

    <div class="row log-row">
      <label for="resume-used" class="log-label">Resume used</label>
      <select id="resume-used" class="grow"></select>
      <button id="log-btn" class="primary">Log it</button>
    </div>
    <div id="log-note" class="log-note" hidden>
      <span id="log-msg"></span>
      <button id="undo-log" class="link" hidden>Undo</button>
    </div>

    <!-- Where the analyzed text came from, with a one-click switch. -->
    <div class="footer">
      <span id="source-info"></span>
      <button id="switch-source" class="link"></button>
    </div>
  </section>

  <script src="../src/scoring.js"></script>
  <script src="../src/log-store.js"></script>
  <script src="../src/profile-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
