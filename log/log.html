<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Application Log — Resume Matcher</title>
  <link rel="stylesheet" href="log.css">
</head>
<body>
  <header>
    <h1>Application log</h1>
    <span id="count" class="muted"></span>
    <span class="spacer"></span>
    <input id="filter" type="search" placeholder="Filter…">
    <button id="export">Export CSV</button>
    <button id="clear" class="danger">Clear all</button>
  </header>

  <table>
    <thead>
      <tr><th>Date</th><th>Company</th><th>Title</th><th>Resume used</th><th>Verdict</th><th>Score</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="empty" class="muted" hidden>No applications logged yet. Use “Log this application” in the popup.</p>

  <script src="../src/log-store.js"></script>
  <script src="log.js"></script>
</body>
</html>
